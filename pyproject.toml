[project]
name = "reachy-iris-mission-control"
version = "0.1.0"
description = "Local, presenter-led Redis Iris story for Reachy Mini Lite"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
vision = [
  "opencv-python>=4.10,<5",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=4.50,<6",
  "supervision>=0.28,<0.31",
  "trackers>=2,<4",
  "reachy-mini>=1.10,<2",
]
test = ["pytest>=8,<10", "fakeredis>=2,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "settings"]

[tool.setuptools.packages.find]
include = ["components*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
